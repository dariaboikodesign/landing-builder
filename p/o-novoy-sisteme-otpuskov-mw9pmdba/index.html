<style>
/*
 * Бренд-токены. Значения сняты с макетов «Лендинги — Ready For Dev» (Figma).
 * Это единственное место, где задаётся фирменное оформление: и редактор,
 * и опубликованная страница, и скачиваемый HTML берут цвета, шрифты,
 * отступы и скругления отсюда.
 */
:root {
  /* Цвет */
  --color-brand: #503ae0;
  --color-brand-hover: #4330c7;
  --color-brand-soft: #e0dbff;
  --color-cta-on-dark: #4592d9;
  --color-cta-on-dark-hover: #3a80c2;
  --color-text: #161a33;
  --color-text-secondary: #656c94;
  --color-text-inverse: #ffffff;
  --color-text-inverse-secondary: rgba(255, 255, 255, 0.7);
  --color-link: #1a49c9;
  --color-bg: #f4f4f6;
  --color-bg-secondary: #f0f2ff;
  --color-surface: #ffffff;
  --color-border: #e3e5f0;
  --color-border-strong: #c9cce0;
  --color-dark: #1c172e;
  --color-dark-2: #2a1f6b;
  --color-danger: #d92d4b;
  --color-danger-soft: #fde8ec;
  --color-success: #1f9d63;

  /* Типографика */
  --font-family: 'Onest', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  --weight-regular: 400;
  --weight-medium: 500;

  --type-display-1: 64px;
  --lh-display-1: 68px;
  --ls-display-1: -1.6px;
  --type-display-2: 56px;
  --lh-display-2: 60px;
  --ls-display-2: -1.4px;
  --type-h2: 32px;
  --lh-h2: 36px;
  --ls-h2: -0.6px;
  --type-h3: 24px;
  --lh-h3: 28px;
  --ls-h3: -0.2px;
  --type-h4: 20px;
  --lh-h4: 26px;
  --type-body-l: 18px;
  --lh-body-l: 28px;
  --type-body-m: 16px;
  --lh-body-m: 24px;
  --type-body-s: 14px;
  --lh-body-s: 20px;
  --type-caption: 12px;
  --lh-caption: 16px;

  /* Отступы */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-30: 120px;

  /* Скругления */
  --radius-s: 8px;
  --radius-m: 10px;
  --radius-l: 12px;
  --radius-xl: 16px;
  --radius-card: 20px;
  --radius-panel: 24px;
  --radius-pill: 999px;

  /* Тени */
  --shadow-s: 0 1px 2px rgba(22, 26, 51, 0.06);
  --shadow-m: 0 4px 16px rgba(22, 26, 51, 0.08);
  --shadow-l: 0 12px 40px rgba(22, 26, 51, 0.12);
}

html, body { margin: 0; padding: 0; }
/*
 * Стили сгенерированного лендинга. Используются в редакторе, локальном
 * предпросмотре и скачиваемом HTML (вставляются туда вместе с tokens.css).
 * Адаптивность — через container queries: страница подстраивается под ширину
 * своего контейнера, поэтому мобильная рамка в редакторе и реальный телефон
 * показывают одну и ту же вёрстку.
 */

.lp {
  container: lp / inline-size;
  font-family: var(--font-family);
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'lnum' 1, 'tnum' 1;
  overflow-wrap: break-word;
  overflow-x: clip;
}

.lp *,
.lp *::before,
.lp *::after {
  box-sizing: border-box;
}

:where(.lp) :where(h1, h2, h3, p, ul, ol) {
  margin: 0;
  padding: 0;
}

:where(.lp) :where(ul, ol) {
  list-style: none;
}

:where(.lp) img {
  display: block;
  max-width: 100%;
}

.lp-page {
  display: flex;
  flex-direction: column;
  gap: var(--space-20);
  padding-bottom: 0;
}

.lp-container {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding-inline: var(--space-30);
}

/* ——— Типографика ——— */

.lp-hero__title,
.lp-section__title,
.lp-final__title,
.lp-card__title,
.lp-card__text,
.lp-card__secondary,
.lp-card__note,
.lp-hero__subtitle,
.lp-text__p,
.lp-final__text,
.lp-section__note,
.lp-program__text {
  white-space: pre-line;
}

.lp-section__title {
  font-size: var(--type-display-2);
  line-height: var(--lh-display-2);
  letter-spacing: var(--ls-display-2);
  font-weight: var(--weight-medium);
  text-align: center;
  margin-bottom: var(--space-12);
  text-wrap: balance;
}

/* ——— Обложка ——— */

.lp-hero {
  position: relative;
  isolation: isolate;
  min-height: 736px;
  display: flex;
  align-items: center;
  padding-block: var(--space-30) 160px;
}

.lp-hero--dark {
  color: var(--color-text-inverse);
  background:
    radial-gradient(60% 80% at 78% 40%, rgba(124, 92, 255, 0.55) 0%, rgba(124, 92, 255, 0) 70%),
    radial-gradient(50% 70% at 95% 100%, rgba(69, 146, 217, 0.45) 0%, rgba(69, 146, 217, 0) 70%),
    linear-gradient(160deg, #241a5c 0%, var(--color-dark) 55%, #120e22 100%);
}

.lp-hero--light {
  color: var(--color-text);
  background:
    radial-gradient(55% 75% at 80% 35%, rgba(160, 140, 255, 0.45) 0%, rgba(160, 140, 255, 0) 70%),
    linear-gradient(180deg, var(--color-bg-secondary) 0%, #e8e4ff 100%);
}

.lp-hero__bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
  z-index: -1;
  pointer-events: none;
}

.lp-hero__space {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
  opacity: 0.55;
  mix-blend-mode: screen;
}

.lp-hero__art {
  position: absolute;
  right: max(40px, calc(50% - 640px));
  top: 50%;
  width: 440px;
  transform: translateY(-50%) rotate(-6deg);
  filter: drop-shadow(0 30px 60px rgba(20, 10, 60, 0.35));
}

.lp-hero__content {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-6);
}

.lp-hero__title {
  font-size: var(--type-display-1);
  line-height: var(--lh-display-1);
  letter-spacing: var(--ls-display-1);
  font-weight: var(--weight-medium);
  max-width: 800px;
  text-wrap: balance;
}

.lp-hero__subtitle {
  font-size: var(--type-h4);
  line-height: var(--lh-h4);
  letter-spacing: -0.2px;
  font-weight: var(--weight-medium);
  max-width: 640px;
}

.lp-hero--dark .lp-hero__subtitle {
  color: var(--color-text-inverse-secondary);
}

.lp-hero--light .lp-hero__subtitle {
  color: var(--color-text-secondary);
}

.lp-hero__actions {
  margin-top: var(--space-6);
}

.lp-badges {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.lp-badge {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  padding: 6px var(--space-3);
  border-radius: var(--radius-xl);
  font-size: var(--type-body-s);
  line-height: var(--lh-body-s);
  font-weight: var(--weight-medium);
}

.lp-hero--dark .lp-badge {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(16px);
  color: var(--color-text-inverse);
}

.lp-hero--light .lp-badge {
  background: rgba(255, 255, 255, 0.7);
  color: var(--color-text);
}

/* ——— Кнопки ——— */

.lp-cta {
  position: relative;
  display: inline-flex;
}

.lp-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 240px;
  min-height: 64px;
  padding: var(--space-4) var(--space-8);
  border-radius: var(--radius-l);
  border: 0;
  font: inherit;
  font-size: var(--type-body-l);
  line-height: var(--lh-body-l);
  font-weight: var(--weight-medium);
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.15s ease;
}

.lp-btn--brand {
  background: var(--color-brand);
  color: var(--color-text-inverse);
}

.lp-btn--brand:hover {
  background: var(--color-brand-hover);
}

.lp-btn--on-dark {
  background: var(--color-cta-on-dark);
  color: var(--color-text-inverse);
}

.lp-btn--on-dark:hover {
  background: var(--color-cta-on-dark-hover);
}

.lp-btn:focus-visible {
  outline: 3px solid var(--color-brand-soft);
  outline-offset: 3px;
}

.lp-btn.is-disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* ——— Секции ——— */

.lp-section__note {
  margin-top: var(--space-6);
  text-align: center;
  font-size: var(--type-body-l);
  line-height: var(--lh-body-l);
  color: var(--color-text-secondary);
}

.lp-section__actions {
  display: flex;
  justify-content: center;
  margin-top: var(--space-8);
}

.lp-card {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  padding: var(--space-6);
  border-radius: var(--radius-card);
  background: var(--color-surface);
}

.lp-card--step {
  padding: var(--space-5);
}

.lp-card__accent {
  font-size: var(--type-h2);
  line-height: var(--lh-h2);
  letter-spacing: var(--ls-h2);
  font-weight: var(--weight-medium);
}

.lp-card__accent--brand {
  color: var(--color-brand);
}

.lp-card__text {
  font-size: var(--type-body-l);
  line-height: var(--lh-h4);
  letter-spacing: -0.1px;
  font-weight: var(--weight-medium);
}

.lp-card__note {
  margin-top: var(--space-2);
  font-size: var(--type-body-m);
  line-height: var(--lh-body-m);
}

.lp-card__title {
  font-size: var(--type-h3);
  line-height: var(--lh-h3);
  letter-spacing: var(--ls-h3);
  font-weight: var(--weight-medium);
}

.lp-card__secondary {
  font-size: var(--type-body-m);
  line-height: var(--lh-body-m);
  color: var(--color-text-secondary);
}

.lp-cards,
.lp-steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-2);
}

.lp-steps {
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

/* Таймлайн «Важные даты» */
.lp-dates {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-2);
}

.lp-dates__item {
  position: relative;
  padding-top: var(--space-10);
}

.lp-dates__item::before {
  content: '';
  position: absolute;
  top: 0;
  left: var(--space-2);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--color-brand-soft);
  z-index: 1;
}

.lp-dates__item::after {
  content: '';
  position: absolute;
  top: 10px;
  left: 0;
  right: calc(var(--space-2) * -1);
  height: 4px;
  border-radius: 2px;
  background: var(--color-brand-soft);
}

.lp-dates__item:last-child::after {
  right: 0;
}

/* Программа события */
.lp-program {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  max-width: 960px;
  margin: 0 auto;
}

.lp-program__row {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: var(--space-6);
  align-items: baseline;
  padding: var(--space-6);
  border-radius: var(--radius-card);
  background: var(--color-surface);
}

.lp-program__time {
  font-size: var(--type-h3);
  line-height: var(--lh-h3);
  letter-spacing: var(--ls-h3);
  font-weight: var(--weight-medium);
  color: var(--color-brand);
}

.lp-program__text {
  font-size: var(--type-body-l);
  line-height: var(--lh-body-l);
}

/* Текстовый блок */
.lp-text {
  max-width: 1040px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.lp-text .lp-section__title {
  margin-bottom: var(--space-6);
}

.lp-text__p {
  width: 100%;
  max-width: 800px;
  text-align: center;
  font-size: var(--type-body-l);
  line-height: var(--lh-body-l);
  color: var(--color-text-secondary);
}

.lp-text__p + .lp-text__p {
  margin-top: var(--space-4);
}

/* Финальный CTA */
.lp-final {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: 560px;
  display: flex;
  align-items: center;
  padding-block: var(--space-20) 200px;
  color: var(--color-text-inverse);
  background:
    radial-gradient(50% 60% at 50% 0%, rgba(124, 92, 255, 0.45) 0%, rgba(124, 92, 255, 0) 70%),
    linear-gradient(180deg, #2a1f6b 0%, var(--color-dark) 100%);
}

.lp-final__bg {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

.lp-final__space {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
  opacity: 0.5;
  mix-blend-mode: screen;
  transform: scaleY(-1);
}

.lp-final__art {
  position: absolute;
  width: 300px;
  filter: drop-shadow(0 20px 40px rgba(10, 5, 40, 0.4));
}

.lp-final__art--left {
  left: -20px;
  bottom: -40px;
  transform: rotate(-8deg);
}

.lp-final__art--right {
  right: -10px;
  bottom: -30px;
  width: 260px;
  transform: rotate(12deg);
}

.lp-final__content {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-5);
  text-align: center;
}

.lp-final__title {
  max-width: 800px;
  font-size: var(--type-display-2);
  line-height: var(--lh-display-2);
  letter-spacing: var(--ls-display-2);
  font-weight: var(--weight-medium);
  text-wrap: balance;
}

.lp-final__text {
  max-width: 800px;
  font-size: var(--type-h3);
  line-height: 32px;
  letter-spacing: -0.2px;
  font-weight: var(--weight-medium);
  color: var(--color-text-inverse-secondary);
}

.lp-final__actions {
  margin-top: var(--space-10);
}

/* Каркас во время сборки */
.lp-skeleton {
  padding-block: var(--space-6);
}

.lp-skeleton--hero {
  min-height: 600px;
  padding-block: var(--space-30);
  background: linear-gradient(160deg, #e9e6fb 0%, #f1f0f8 100%);
}

.lp-skeleton--final {
  min-height: 360px;
  padding-block: var(--space-20);
  background: #ebe9f6;
}

.lp-skeleton .lp-container {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.lp-skeleton:not(.lp-skeleton--hero) .lp-container {
  align-items: center;
}

.lp-skel {
  display: block;
  border-radius: var(--radius-l);
  background: linear-gradient(90deg, #e3e1f0 0%, #f2f1f8 50%, #e3e1f0 100%);
  background-size: 200% 100%;
  animation: lp-shimmer 1.2s ease-in-out infinite;
}

.lp-skel--badge { width: 140px; height: 32px; border-radius: var(--radius-xl); }
.lp-skel--h1 { width: min(720px, 90%); height: 56px; }
.lp-skel--short { width: min(420px, 60%); }
.lp-skel--p { width: min(560px, 80%); height: 24px; margin-top: var(--space-2); }
.lp-skel--btn { width: 240px; height: 64px; margin-top: var(--space-6); }
.lp-skel--h2 { width: min(480px, 70%); height: 48px; margin-bottom: var(--space-6); }
.lp-skel--card { flex: 1; height: 200px; border-radius: var(--radius-card); }

.lp-skel-row {
  display: flex;
  gap: var(--space-2);
  width: 100%;
}

@keyframes lp-shimmer {
  from { background-position: 100% 0; }
  to { background-position: -100% 0; }
}

@media (prefers-reduced-motion: reduce) {
  .lp-skel { animation: none; }
}

/* ——— Планшет ——— */
@container lp (max-width: 1100px) {
  .lp-container { padding-inline: var(--space-10); }
  .lp-hero__title { font-size: 52px; line-height: 56px; letter-spacing: -1.2px; max-width: 620px; }
  .lp-hero__art { width: 320px; right: 24px; opacity: 0.9; }
  .lp-section__title,
  .lp-final__title { font-size: 44px; line-height: 48px; letter-spacing: -1px; }
  .lp-final__art { width: 220px; }
  .lp-final__art--right { width: 190px; }
}

/* ——— Мобильный ——— */
@container lp (max-width: 720px) {
  .lp-page { gap: var(--space-16); }
  .lp-container { padding-inline: var(--space-5); }

  .lp-hero {
    min-height: 0;
    align-items: flex-start;
    padding-block: var(--space-12) 220px;
  }
  .lp-hero__art {
    top: auto;
    bottom: -10px;
    right: 50%;
    width: 220px;
    transform: translateX(50%) rotate(-6deg);
  }
  .lp-hero__title { font-size: 36px; line-height: 40px; letter-spacing: -0.8px; }
  .lp-hero__subtitle { font-size: var(--type-body-l); line-height: 24px; }
  .lp-hero__actions { margin-top: var(--space-2); width: 100%; }

  .lp-section__title,
  .lp-final__title { font-size: 32px; line-height: 36px; letter-spacing: -0.6px; margin-bottom: var(--space-8); }
  .lp-final__title { margin-bottom: 0; }
  .lp-text .lp-section__title { margin-bottom: var(--space-4); }

  .lp-cta { width: 100%; }
  .lp-btn { width: 100%; min-width: 0; min-height: 56px; }
  .lp-section__actions .lp-cta { width: 100%; }

  .lp-card__accent { font-size: var(--type-h3); line-height: var(--lh-h3); letter-spacing: var(--ls-h3); }
  .lp-card { padding: var(--space-5); }

  .lp-dates { grid-template-columns: 1fr; gap: var(--space-3); }
  .lp-dates__item { padding-top: 0; padding-left: var(--space-10); }
  .lp-dates__item::before { top: var(--space-5); left: 0; }
  .lp-dates__item::after {
    top: var(--space-5);
    bottom: calc(var(--space-3) * -1 - var(--space-5));
    left: 10px;
    right: auto;
    width: 4px;
    height: auto;
  }
  .lp-dates__item:last-child::after { display: none; }

  .lp-program__row { grid-template-columns: 1fr; gap: var(--space-2); padding: var(--space-5); }
  .lp-program__time { font-size: var(--type-h4); line-height: var(--lh-h4); }

  .lp-text__p { text-align: left; font-size: var(--type-body-m); line-height: var(--lh-body-m); }

  .lp-final { min-height: 0; padding-block: var(--space-16) 180px; }
  .lp-final__text { font-size: var(--type-body-l); line-height: 24px; }
  .lp-final__actions { margin-top: var(--space-4); width: 100%; }
  .lp-final__art { width: 150px; }
  .lp-final__art--left { left: -30px; bottom: -30px; }
  .lp-final__art--right { width: 130px; right: -20px; bottom: -20px; }

  .lp-skel-row { flex-direction: column; }
}

</style>
